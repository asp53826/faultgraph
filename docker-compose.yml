services:
  faultgraph:
    build:
      context: .
      dockerfile: Dockerfile
    image: faultgraph:local
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - faultgraph-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  faultgraph-data:
