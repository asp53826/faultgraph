version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:40"
      timezone: America/New_York
    open-pull-requests-limit: 3
    groups:
      python-patch-updates:
        update-types: [patch]
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "07:50"
      timezone: America/New_York
    open-pull-requests-limit: 3
    groups:
      frontend-patch-updates:
        update-types: [patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
