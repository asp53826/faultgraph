name: Release Steward

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Build verified artifacts
        run: |
          python -m pip install "uv==0.11.26" build
          uv sync --frozen --all-groups
          uv run pytest
          python -m build --wheel
          npm --prefix apps/web ci
          npm --prefix apps/web test
          npm --prefix apps/web run build
          tar -C apps/web/dist -czf dist/faultgraph-workbench-${GITHUB_REF_NAME}.tar.gz .
          sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: "dist/*"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
