name: Release Steward

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Build verified artifacts
        run: |
          python -m pip install "uv==0.11.26" build
          uv sync --frozen --all-groups
          uv run pytest
          python -m build --wheel
          npm --prefix apps/web ci
          npm --prefix apps/web test
          npm --prefix apps/web run build
          tar -C apps/web/dist -czf dist/faultgraph-workbench-${GITHUB_REF_NAME}.tar.gz .
          sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: "dist/*"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
