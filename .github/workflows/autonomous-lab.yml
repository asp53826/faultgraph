name: Autonomous Engineering Lab

on:
  schedule:
    - cron: "19 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  repo-medic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - name: Install environments
        run: |
          python -m pip install "uv==0.11.26"
          uv sync --frozen --all-groups
          npm --prefix apps/web ci
      - name: Run health protocol
        id: health
        continue-on-error: true
        run: |
          uv run pytest
          uv run python scripts/check_docs.py
          npm --prefix apps/web test
          npm --prefix apps/web run build
      - name: Open one actionable failure issue
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "[Repo Medic] Scheduled health protocol failed"
        run: |
          existing="$(gh issue list --state open --search "${TITLE} in:title" --json number --jq '.[0].number // empty')"
          if [ -z "${existing}" ]; then
            gh issue create --title "${TITLE}" --body "The scheduled health protocol failed on run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Review the failing command before changing dependencies or model behavior."
          fi
          exit 1
      - name: Close recovered health issue
        if: steps.health.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "[Repo Medic] Scheduled health protocol failed"
        run: |
          issue="$(gh issue list --state open --search "${TITLE} in:title" --json number --jq '.[0].number // empty')"
          if [ -n "${issue}" ]; then
            gh issue close "${issue}" --comment "The scheduled health protocol recovered in run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          fi

  benchmark-keeper:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '19 7 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install "uv==0.11.26"
      - run: uv sync --frozen --all-groups
      - name: Produce revision-addressed benchmark report
        run: |
          mkdir -p artifacts
          uv run faultgraph benchmark > artifacts/benchmark-${GITHUB_SHA}.json
          sha256sum artifacts/benchmark-${GITHUB_SHA}.json > artifacts/benchmark-${GITHUB_SHA}.sha256
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: benchmark-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
